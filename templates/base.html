<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Minería de Datos{% endblock %} · Proyecto de la materia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    {% block encabezado %}
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">MD</span>
                <span class="brand-text">Minería de Datos</span>
            </div>
            <img class="imagen-header"
                 src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSUWQEL99ngj85ApjDNi3nvYTSrTV12wZ8PVpvIP-8vQ&s"
                 alt="Imagen del proyecto de minería de datos">
        </header>
    {% endblock %}

    <main class="contenido-pagina">
        {% block contenido %}{% endblock %}
    </main>

    <footer class="pie-pagina">
        <p>{{ info_proyecto.materia }} · {{ info_proyecto.titulo }}</p>
    </footer>

</body>
</html>
